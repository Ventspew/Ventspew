<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">macdirtycow project map</title>
  <desc id="desc">Even 4+3 project grid aligned with Inveil and Qadbak.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0f1419"/>
      <stop offset="1" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#e8ecf4"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "SF Pro Display", Segoe UI, Helvetica, Arial, sans-serif; fill: #e8ecf4; letter-spacing: -0.02em; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Helvetica, Arial, sans-serif; fill: #e8ecf4; }
      .body { font: 400 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .tag { font: 600 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Helvetica, Arial, sans-serif; fill: #0f1419; }
      .tag-muted { fill: #e8ecf4; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="40" y="52" class="title">Projects</text>
  <rect x="40" y="64" width="128" height="5" rx="2.5" fill="url(#accentBar)"/>

  <!-- Row 1 -->
  <g transform="translate(40 88)">
    <rect width="265" height="92" rx="16" fill="#1a2332" stroke="rgba(232,236,244,0.1)"/>
    <text x="18" y="32" class="label">Qadbak</text>
    <text x="18" y="54" class="body">Self-hosted hosting panel</text>
    <rect x="171" y="20" width="76" height="24" rx="12" fill="#e8ecf4"/>
    <text x="209" y="37" class="tag" text-anchor="middle">Panel</text>
  </g>

  <g transform="translate(325 88)">
    <rect width="265" height="92" rx="16" fill="#1a2332" stroke="rgba(232,236,244,0.1)"/>
    <text x="18" y="32" class="label">Omiiba3DS</text>
    <text x="18" y="54" class="body">3DS firmware · Boot Hub</text>
    <rect x="199" y="20" width="48" height="24" rx="12" fill="#e8ecf4"/>
    <text x="223" y="37" class="tag" text-anchor="middle">C</text>
  </g>

  <g transform="translate(610 88)">
    <rect width="265" height="92" rx="16" fill="#1a2332" stroke="rgba(232,236,244,0.1)"/>
    <text x="18" y="32" class="label">Omiiba Connect</text>
    <text x="18" y="54" class="body">Sony headphones on Mac</text>
    <rect x="181" y="20" width="66" height="24" rx="12" fill="#e8ecf4"/>
    <text x="214" y="37" class="tag" text-anchor="middle">macOS</text>
  </g>

  <g transform="translate(895 88)">
    <rect width="265" height="92" rx="16" fill="#1a2332" stroke="rgba(232,236,244,0.1)"/>
    <text x="18" y="32" class="label">qadbak-ios</text>
    <text x="18" y="54" class="body">SwiftUI panel client</text>
    <rect x="191" y="20" width="56" height="24" rx="12" fill="#e8ecf4"/>
    <text x="219" y="37" class="tag" text-anchor="middle">Swift</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(40 200)">
    <rect width="360" height="92" rx="16" fill="#1a2332" stroke="rgba(232,236,244,0.1)"/>
    <text x="18" y="32" class="label">Structify</text>
    <text x="18" y="54" class="body">Planning · less chaos</text>
    <rect x="294" y="20" width="48" height="24" rx="12" fill="#e8ecf4"/>
    <text x="318" y="37" class="tag" text-anchor="middle">App</text>
  </g>

  <g transform="translate(420 200)">
    <rect width="360" height="92" rx="16" fill="#1a2332" stroke="rgba(232,236,244,0.1)"/>
    <text x="18" y="32" class="label">earthpods</text>
    <text x="18" y="54" class="body">AirPods · open stack</text>
    <rect x="248" y="20" width="94" height="24" rx="12" fill="#e8ecf4"/>
    <text x="295" y="37" class="tag" text-anchor="middle">Kotlin</text>
  </g>

  <g transform="translate(800 200)">
    <rect width="360" height="92" rx="16" fill="#1a2332" stroke="rgba(232,236,244,0.1)"/>
    <text x="18" y="32" class="label">DefianceSign</text>
    <text x="18" y="54" class="body">Open-source IPA signer</text>
    <rect x="294" y="20" width="48" height="24" rx="12" fill="#2d3a4f"/>
    <text x="318" y="37" class="tag tag-muted" text-anchor="middle">iOS</text>
  </g>
</svg>
