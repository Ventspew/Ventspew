<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">macdirtycow project map</title>
  <desc id="desc">Even 4+3 project grid aligned with omiiba.dev.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#000000"/>
      <stop offset="1" stop-color="#161617"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#6e7bff"/>
      <stop offset="0.42" stop-color="#5ac8fa"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "SF Pro Display", Segoe UI, Helvetica, Arial, sans-serif; fill: #f5f5f7; letter-spacing: -0.02em; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Helvetica, Arial, sans-serif; fill: #f5f5f7; }
      .body { font: 400 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Helvetica, Arial, sans-serif; fill: #a1a1a6; }
      .tag { font: 600 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Helvetica, Arial, sans-serif; fill: #ffffff; }
      .tag-muted { fill: #d2d2d7; }
    </style>
  </defs>

  <!-- Layout: pad 40, gap 20, row1 h 92, row2 h 92 -->
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="40" y="52" class="title">Projects</text>
  <rect x="40" y="64" width="128" height="5" rx="2.5" fill="url(#accentBar)"/>

  <!-- Row 1: 4 × 265px cards -->
  <g transform="translate(40 88)">
    <rect width="265" height="92" rx="16" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="18" y="32" class="label">Omiiba3DS</text>
    <text x="18" y="54" class="body">3DS firmware · Boot Hub</text>
    <rect x="199" y="20" width="48" height="24" rx="12" fill="#0071e3"/>
    <text x="223" y="37" class="tag" text-anchor="middle">C</text>
  </g>

  <g transform="translate(325 88)">
    <rect width="265" height="92" rx="16" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="18" y="32" class="label">Omiiba Connect</text>
    <text x="18" y="54" class="body">Sony headphones on Mac</text>
    <rect x="181" y="20" width="66" height="24" rx="12" fill="#0071e3"/>
    <text x="214" y="37" class="tag" text-anchor="middle">macOS</text>
  </g>

  <g transform="translate(610 88)">
    <rect width="265" height="92" rx="16" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="18" y="32" class="label">Structify</text>
    <text x="18" y="54" class="body">Planning · less chaos</text>
    <rect x="191" y="20" width="56" height="24" rx="12" fill="#0071e3"/>
    <text x="219" y="37" class="tag" text-anchor="middle">Swift</text>
  </g>

  <g transform="translate(895 88)">
    <rect width="265" height="92" rx="16" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="18" y="32" class="label">earthpods</text>
    <text x="18" y="54" class="body">AirPods · open stack</text>
    <rect x="179" y="20" width="68" height="24" rx="12" fill="#0071e3"/>
    <text x="213" y="37" class="tag" text-anchor="middle">Kotlin</text>
  </g>

  <!-- Row 2: 3 × 360px cards -->
  <g transform="translate(40 200)">
    <rect width="360" height="92" rx="16" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="18" y="32" class="label">omiiba-creative-play</text>
    <text x="18" y="54" class="body">Omiiba UI experiments</text>
    <rect x="248" y="20" width="94" height="24" rx="12" fill="#0071e3"/>
    <text x="295" y="37" class="tag" text-anchor="middle">TypeScript</text>
  </g>

  <g transform="translate(420 200)">
    <rect width="360" height="92" rx="16" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="18" y="32" class="label">StructifyApp</text>
    <text x="18" y="54" class="body">Ideas · workflow structure</text>
    <rect x="294" y="20" width="48" height="24" rx="12" fill="#0071e3"/>
    <text x="318" y="37" class="tag" text-anchor="middle">App</text>
  </g>

  <g transform="translate(800 200)">
    <rect width="360" height="92" rx="16" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="18" y="32" class="label">StakeLinker</text>
    <text x="18" y="54" class="body">Early project · README WIP</text>
    <rect x="294" y="20" width="48" height="24" rx="12" fill="#3a3a3c"/>
    <text x="318" y="37" class="tag tag-muted" text-anchor="middle">WIP</text>
  </g>
</svg>
