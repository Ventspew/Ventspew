<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">macdirtycow project map</title>
  <desc id="desc">Project map aligned with omiiba.dev — dark cards, blue accent, gradient title bar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#000000"/>
      <stop offset="1" stop-color="#161617"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#6e7bff"/>
      <stop offset="0.42" stop-color="#5ac8fa"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; fill: #f5f5f7; letter-spacing: -0.02em; }
      .label { font: 600 20px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; fill: #f5f5f7; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; fill: #a1a1a6; }
      .tag { font: 600 12px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>
  <text x="48" y="58" class="title">Projects</text>
  <rect x="48" y="72" width="140" height="6" rx="3" fill="url(#accentBar)"/>

  <g transform="translate(48 100)">
    <rect width="352" height="88" rx="18" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="34" class="label">Omiiba3DS</text>
    <text x="20" y="58" class="body">3DS firmware — Boot Hub, labs, OTA helpers</text>
    <rect x="268" y="22" width="56" height="26" rx="13" fill="#0071e3"/>
    <text x="286" y="40" class="tag">C</text>
  </g>

  <g transform="translate(424 100)">
    <rect width="352" height="88" rx="18" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="34" class="label">Omiiba Connect</text>
    <text x="20" y="58" class="body">Sony headphones on macOS</text>
    <rect x="248" y="22" width="84" height="26" rx="13" fill="#0071e3"/>
    <text x="262" y="40" class="tag">macOS</text>
  </g>

  <g transform="translate(800 100)">
    <rect width="352" height="88" rx="18" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="34" class="label">Structify</text>
    <text x="20" y="58" class="body">Planning app — clarity over chaos</text>
    <rect x="268" y="22" width="56" height="26" rx="13" fill="#0071e3"/>
    <text x="258" y="40" class="tag">Swift</text>
  </g>

  <g transform="translate(48 208)">
    <rect width="352" height="88" rx="18" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="34" class="label">earthpods</text>
    <text x="20" y="58" class="body">AirPods outside Apple's ecosystem</text>
    <rect x="248" y="22" width="84" height="26" rx="13" fill="#0071e3"/>
    <text x="266" y="40" class="tag">Kotlin</text>
  </g>

  <g transform="translate(424 208)">
    <rect width="352" height="88" rx="18" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="34" class="label">omiiba-creative-play</text>
    <text x="20" y="58" class="body">Omiiba UI experiments</text>
    <rect x="228" y="22" width="104" height="26" rx="13" fill="#0071e3"/>
    <text x="244" y="40" class="tag">TypeScript</text>
  </g>

  <g transform="translate(800 208)">
    <rect width="352" height="88" rx="18" fill="#161617" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="34" class="label">StructifyApp</text>
    <text x="20" y="58" class="body">Ideas and workflow structure</text>
    <rect x="268" y="22" width="56" height="26" rx="13" fill="#0071e3"/>
    <text x="282" y="40" class="tag">App</text>
  </g>

  <g transform="translate(424 316)">
    <rect width="352" height="88" rx="18" fill="#161617" stroke="rgba(255,255,255,0.14)" stroke-dasharray="6 4"/>
    <text x="20" y="34" class="label">StakeLinker</text>
    <text x="20" y="58" class="body">Early project — README forming</text>
    <rect x="268" y="22" width="56" height="26" rx="13" fill="#3a3a3c"/>
    <text x="280" y="40" class="tag" fill="#a1a1a6">WIP</text>
  </g>
</svg>
