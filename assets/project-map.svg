<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">macdirtycow project map</title>
  <desc id="desc">A project map showing Omiiba3DS, Structify, earthpods, omiiba creative play, StructifyApp, and StakeLinker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#130c08"/>
      <stop offset="1" stop-color="#28160f"/>
    </linearGradient>
    <style>
      .title { font: 800 34px Inter, Segoe UI, Arial, sans-serif; fill: #fff0d0; }
      .label { font: 800 22px Inter, Segoe UI, Arial, sans-serif; fill: #ffcc8a; }
      .body { font: 500 15px Inter, Segoe UI, Arial, sans-serif; fill: #e6cdb1; }
      .tag { font: 800 13px Inter, Segoe UI, Arial, sans-serif; fill: #130c08; }
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" class="title">project universe</text>
  <rect x="54" y="82" width="160" height="8" rx="4" fill="#cc6600"/>

  <g transform="translate(54 116)">
    <rect width="332" height="86" rx="18" fill="#23140d" stroke="#8a4b24"/>
    <text x="22" y="34" class="label">Omiiba3DS</text>
    <text x="22" y="60" class="body">3DS firmware fork, Boot Hub, OTA helpers</text>
    <rect x="236" y="20" width="68" height="26" rx="13" fill="#cc6600"/>
    <text x="257" y="38" class="tag">C</text>
  </g>

  <g transform="translate(434 116)">
    <rect width="332" height="86" rx="18" fill="#23140d" stroke="#8a4b24"/>
    <text x="22" y="34" class="label">Structify</text>
    <text x="22" y="60" class="body">macOS planning app for clarity over chaos</text>
    <rect x="236" y="20" width="68" height="26" rx="13" fill="#cc6600"/>
    <text x="251" y="38" class="tag">Swift</text>
  </g>

  <g transform="translate(814 116)">
    <rect width="332" height="86" rx="18" fill="#23140d" stroke="#8a4b24"/>
    <text x="22" y="34" class="label">earthpods</text>
    <text x="22" y="60" class="body">AirPods outside Apple's ecosystem</text>
    <rect x="224" y="20" width="86" height="26" rx="13" fill="#cc6600"/>
    <text x="244" y="38" class="tag">Kotlin</text>
  </g>

  <g transform="translate(54 228)">
    <rect width="332" height="86" rx="18" fill="#23140d" stroke="#8a4b24"/>
    <text x="22" y="34" class="label">omiiba-creative-play</text>
    <text x="22" y="60" class="body">creative TypeScript playground</text>
    <rect x="206" y="20" width="104" height="26" rx="13" fill="#cc6600"/>
    <text x="223" y="38" class="tag">TypeScript</text>
  </g>

  <g transform="translate(434 228)">
    <rect width="332" height="86" rx="18" fill="#23140d" stroke="#8a4b24"/>
    <text x="22" y="34" class="label">StructifyApp</text>
    <text x="22" y="60" class="body">focused idea and workflow structure tool</text>
    <rect x="226" y="20" width="84" height="26" rx="13" fill="#cc6600"/>
    <text x="242" y="38" class="tag">App</text>
  </g>

  <g transform="translate(814 228)">
    <rect width="332" height="86" rx="18" fill="#23140d" stroke="#8a4b24"/>
    <text x="22" y="34" class="label">StakeLinker</text>
    <text x="22" y="60" class="body">early project, ready for a sharper README</text>
    <rect x="226" y="20" width="84" height="26" rx="13" fill="#cc6600"/>
    <text x="244" y="38" class="tag">WIP</text>
  </g>
</svg>
