<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">macdirtycow profile banner</title>
  <desc id="desc">A warm brown developer banner for macdirtycow with project chips and a tiny handheld console illustration.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#cc6600" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#3a2014" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#100905"/>
    </radialGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#3a2115"/>
      <stop offset="1" stop-color="#17100c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="34" fill="#100905"/>
  <rect width="1200" height="420" rx="34" fill="url(#glow)"/>
  <path d="M0 340C150 295 268 365 425 318C585 270 690 250 850 302C990 348 1085 315 1200 285V420H0V340Z" fill="#1b100b" opacity="0.88"/>
  <path d="M0 85C150 32 269 74 405 54C550 33 660 -5 810 42C965 91 1050 74 1200 35V0H0V85Z" fill="#2a170f" opacity="0.7"/>

