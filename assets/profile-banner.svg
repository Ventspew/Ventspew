    <rect x="108" y="108" width="84" height="10" rx="5" fill="#cc6600"/>
    <text x="108" y="165" fill="#fff0d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">macdirtycow</text>
    <text x="111" y="205" fill="#ffcc8a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">custom firmware experiments + practical apps</text>
    <text x="111" y="246" fill="#d8bfa4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Omiiba3DS " Structify " earthpods " creative tools</text>
    <g>
