      <text x="268" y="301" fill="#fff0d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Swift</text>
      <rect x="376" y="278" width="120" height="34" rx="17" fill="#2b1810" stroke="#8a4b24"/>
      <text x="398" y="301" fill="#fff0d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Kotlin</text>
      <rect x="510" y="278" width="150" height="34" rx="17" fill="#2b1810" stroke="#8a4b24"/>
      <text x="535" y="301" fill="#fff0d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">TypeScript</text>
